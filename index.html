    <title>VA-11 HALL-A Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'VT323', monospace;
      }
      @keyframes blink {
        50% { opacity: 0; }
      }
      .blinking-cursor {
        animation: blink 1s step-end infinite;
      }
      .text-shadow-pink {
        text-shadow: 0 0 5px #ff007f, 0 0 7px #ff007f, 0 0 10px #ff007f;
      }
      .text-shadow-cyan {
        text-shadow: 0 0 5px #00f5d4, 0 0 7px #00f5d4, 0 0 10px #00f5d4;
      }
      @keyframes fadeIn {
        from { 
          opacity: 0;
          transform: translateY(10px);
        }
        to { 
          opacity: 1;
          transform: translateY(0);
        }
      }
      .page-transition {
        animation: fadeIn 0.4s ease-out;
      }
      
      .volume-slider {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 2px;
        background: #401f68;
        outline: none;
        opacity: 0.7;
        transition: opacity .2s;
        cursor: pointer;
      }
      .volume-slider:hover {
        opacity: 1;
      }
      .volume-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 14px;
        height: 14px;
        background: #00f5d4;
        border: 2px solid #1a0933;
        box-shadow: 0 0 4px #00f5d4;
      }
      .volume-slider::-moz-range-thumb {
        width: 10px;
        height: 10px;
        background: #00f5d4;
        border: 2px solid #1a0933;
        box-shadow: 0 0 4px #00f5d4;
        cursor: pointer;
      }
      .retro-filter {
        filter: sepia(0.6) contrast(1.1) brightness(0.9) saturate(1.2);
      }
      
    </style>
